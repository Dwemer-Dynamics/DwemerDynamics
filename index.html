<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Dwemer Dynamics</title>
    <link rel="icon" type="image/x-icon" href="img/favicon.ico">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/cards.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/hub.css">
</head>
<body class="theme">
    <div style="overflow:auto">
        <div class="header">
            <div class="headerTitle">
                <img src="./img/dd_logo.png" alt="Dwemer Dynamics logo" id="logo">
                <a href="./index.html" id="headerTitle">Dwemer Dynamics</a>
            </div>
        </div>
    </div>

    <div class="hubPageLayout">
        <div class="hubContainer">
            <div class="hubPicker">
                <div class="hubColumn" id="chimHub">
                    <div class="hubTileArtwork">
                        <img src="./img/chim_home_tile.jpg" alt="CHIM home artwork">
                    </div>
                    <a href="./chim/index.html" class="hubTileLink" aria-label="Open CHIM guide"></a>
                    <div class="hubTileCaption">
                        <div class="hubTileCaptionTitle hubTileCaptionSkyrim">Skyrim Special Edition / Skyrim VR</div>
                        <div class="hubTileActions">
                            <a class="hubTileActionButton hubTileActionButtonChim" href="https://www.nexusmods.com/skyrimspecialedition/mods/126330?tab=files" target="_blank" rel="noopener noreferrer">Download</a>
                            <a class="hubTileActionButton hubTileActionButtonChim" href="./chim/installation.html">Install Guide</a>
                        </div>
                    </div>
                </div>
                <div class="hubColumn" id="stobeHub">
                    <div class="hubTileArtwork">
                        <img src="./img/stobe_home_tile.jpg" alt="STOBE home artwork">
                    </div>
                    <a href="./stobe/index.html" class="hubTileLink" aria-label="Open STOBE guide"></a>
                    <div class="hubTileCaption">
                        <div class="hubTileCaptionTitle hubTileCaptionStobe">Kenshi</div>
                        <div class="hubTileActions">
                            <a class="hubTileActionButton hubTileActionButtonStobe" href="https://www.nexusmods.com/kenshi/mods/1891?tab=files" target="_blank" rel="noopener noreferrer">Download</a>
                            <a class="hubTileActionButton hubTileActionButtonStobe" href="./stobe/installation.html">Install Guide</a>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card hubIntroCard">
                <h1 class="hubTitle">Meaningful AI Gameplay</h1>
                <p class="hubIntro">Dwemer Dynamics is an AI focused mod team building AI frameworks into popular games.</p>
            </div>
        </div>

        <aside class="patron-shell" aria-label="Current Patreon members">
            <h2 class="patron-title"><a class="patron-title-link" href="https://www.patreon.com/DwemerDynamics" target="_blank" rel="noopener noreferrer">Patreon Members</a></h2>
            <div class="patron-list-scroll" aria-label="Patreon members by tier">
                <div class="patron-list-track" id="patronListTrack"></div>
            </div>
        </aside>
    </div>

    <footer class="hubFooter">
        <div class="hubFooterSocial" aria-label="Dwemer Dynamics social links">
            <a href="https://discord.gg/NDn9qud2ug" target="_blank" rel="noopener noreferrer" aria-label="Discord" title="Discord">
                <img src="./img/discord.png" alt="Discord">
            </a>
            <a href="https://www.youtube.com/@DwemerDynamics" target="_blank" rel="noopener noreferrer" aria-label="YouTube" title="YouTube">
                <img src="./img/youtube.png" alt="YouTube">
            </a>
            <a href="https://www.patreon.com/DwemerDynamics" target="_blank" rel="noopener noreferrer" aria-label="Patreon" title="Patreon">
                <img src="./img/patreon.png" alt="Patreon">
            </a>
        </div>
        <div>Dwemer Dynamics 2026</div>
    </footer>
    <script src="js/patron-list.js" defer></script>
</body>
</html>
