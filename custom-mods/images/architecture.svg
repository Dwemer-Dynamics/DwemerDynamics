<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-labelledby="archTitle archDesc" font-family="Arial, Helvetica, sans-serif">
    <title id="archTitle">Custom mod architecture</title>
    <desc id="archDesc">The game client sends a player line to the server with turn.php. The server reads and saves history, bios and facts in its PostgreSQL database, asks the mock or a configured LLM, and returns a reply with at most one allowlisted action. The client applies the reply on the game thread.</desc>
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0 0L10 5L0 10z" fill="#8cc4ff"/>
        </marker>
    </defs>
    <rect width="760" height="300" rx="10" fill="#121418"/>

    <g fill="#1b2330" stroke="#4da3ff" stroke-width="2">
        <rect x="20" y="80" width="200" height="130" rx="8"/>
        <rect x="290" y="80" width="190" height="130" rx="8"/>
        <rect x="580" y="30" width="160" height="100" rx="8"/>
        <rect x="580" y="170" width="160" height="100" rx="8"/>
    </g>

    <g fill="#ffffff" text-anchor="middle">
        <text x="120" y="115" font-size="19" font-weight="bold">Game client</text>
        <text x="120" y="142" font-size="14" fill="#cdd6e5">ExampleMod or your port</text>
        <text x="120" y="164" font-size="14" fill="#cdd6e5">GameAdapter runs on</text>
        <text x="120" y="184" font-size="14" fill="#cdd6e5">the game thread</text>

        <text x="385" y="115" font-size="19" font-weight="bold">Server</text>
        <text x="385" y="142" font-size="14" fill="#cdd6e5">ExampleServer, PHP 8.2</text>
        <text x="385" y="164" font-size="14" fill="#cdd6e5">in DwemerDistro WSL</text>
        <text x="385" y="184" font-size="14" fill="#cdd6e5">Apache, port 8081</text>

        <text x="660" y="62" font-size="17" font-weight="bold">Database</text>
        <text x="660" y="88" font-size="13" fill="#cdd6e5">PostgreSQL: history,</text>
        <text x="660" y="107" font-size="13" fill="#cdd6e5">bios, facts, logs</text>

        <text x="660" y="202" font-size="17" font-weight="bold">LLM</text>
        <text x="660" y="228" font-size="13" fill="#cdd6e5">mock by default, or</text>
        <text x="660" y="247" font-size="13" fill="#cdd6e5">your provider</text>
    </g>

    <g stroke="#8cc4ff" stroke-width="2" fill="none" marker-end="url(#arrow)">
        <line x1="222" y1="118" x2="286" y2="118"/>
        <line x1="288" y1="172" x2="224" y2="172"/>
        <line x1="482" y1="110" x2="576" y2="86" marker-start="url(#arrow)"/>
        <line x1="482" y1="180" x2="576" y2="210"/>
    </g>

    <g fill="#8cc4ff" font-size="13" text-anchor="middle">
        <text x="254" y="60">1. Request</text>
        <text x="254" y="76" fill="#cdd6e5">turn.php + token</text>
        <text x="254" y="232">4. Reply</text>
        <text x="254" y="248" fill="#cdd6e5">text + allowlisted</text>
        <text x="254" y="264" fill="#cdd6e5">action</text>
        <text x="530" y="66">2. Read, save</text>
        <text x="530" y="240">3. Prompt</text>
    </g>
</svg>
