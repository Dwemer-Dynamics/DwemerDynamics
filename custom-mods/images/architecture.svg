<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-labelledby="archTitle archDesc" font-family="Arial, Helvetica, sans-serif">
    <title id="archTitle">How a KAGRENAC-based mod fits together</title>
    <desc id="archDesc">The game mod sends the player's line and what the game observed to the mod's own named server in DwemerDistro. The server asks the dialogue model you configured and, optionally, a voice service, then returns the reply text, optional voice and any action requests. The game runs only actions it has its own handler for and checks the result itself.</desc>
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0 0L10 5L0 10z" fill="#8cc4ff"/>
        </marker>
    </defs>
    <rect width="760" height="300" rx="10" fill="#121418"/>

    <g fill="#1b2330" stroke="#4da3ff" stroke-width="2">
        <rect x="20" y="80" width="200" height="130" rx="8"/>
        <rect x="290" y="80" width="190" height="130" rx="8"/>
        <rect x="580" y="30" width="160" height="100" rx="8"/>
        <rect x="580" y="170" width="160" height="100" rx="8" stroke-dasharray="6 4"/>
    </g>

    <g fill="#ffffff" text-anchor="middle">
        <text x="120" y="115" font-size="19" font-weight="bold">Your game mod</text>
        <text x="120" y="142" font-size="14" fill="#cdd6e5">In-game chat box,</text>
        <text x="120" y="164" font-size="14" fill="#cdd6e5">subtitles and voice,</text>
        <text x="120" y="184" font-size="14" fill="#cdd6e5">game-owned actions</text>

        <text x="385" y="115" font-size="19" font-weight="bold">Your mod's server</text>
        <text x="385" y="142" font-size="14" fill="#cdd6e5">Named server in</text>
        <text x="385" y="164" font-size="14" fill="#cdd6e5">DwemerDistro: characters,</text>
        <text x="385" y="184" font-size="14" fill="#cdd6e5">memory, dashboard</text>

        <text x="660" y="62" font-size="17" font-weight="bold">Dialogue model</text>
        <text x="660" y="88" font-size="13" fill="#cdd6e5">The provider you</text>
        <text x="660" y="107" font-size="13" fill="#cdd6e5">configured</text>

        <text x="660" y="202" font-size="17" font-weight="bold">Voice (optional)</text>
        <text x="660" y="228" font-size="13" fill="#cdd6e5">Spoken replies,</text>
        <text x="660" y="247" font-size="13" fill="#cdd6e5">push-to-talk</text>
    </g>

    <g stroke="#8cc4ff" stroke-width="2" fill="none" marker-end="url(#arrow)">
        <line x1="222" y1="118" x2="286" y2="118"/>
        <line x1="288" y1="172" x2="224" y2="172"/>
        <line x1="482" y1="110" x2="576" y2="86" marker-start="url(#arrow)"/>
        <line x1="482" y1="180" x2="576" y2="210" marker-start="url(#arrow)"/>
    </g>

    <g fill="#8cc4ff" font-size="13" text-anchor="middle">
        <text x="254" y="44">1. Player line</text>
        <text x="254" y="60" fill="#cdd6e5">+ what the</text>
        <text x="254" y="76" fill="#cdd6e5">game observed</text>
        <text x="254" y="232">3. Reply</text>
        <text x="254" y="248" fill="#cdd6e5">text, voice,</text>
        <text x="254" y="264" fill="#cdd6e5">action requests</text>
        <text x="530" y="66">2. Ask</text>
        <text x="530" y="240">optional</text>
        <text x="120" y="244" fill="#cdd6e5">The game runs or refuses</text>
        <text x="120" y="262" fill="#cdd6e5">each action and checks it</text>
    </g>
</svg>
